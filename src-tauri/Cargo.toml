[package]
name = "pd-ez"
version = "0.1.0"
description = "PD-EZ — offline PDF editor. Pay once, own it forever."
authors = ["Zuga Technologies"]
edition = "2021"
default-run = "pd-ez"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mint_lease"
path = "src/bin/mint_lease.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.2"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
base64 = "0.22.1"
rand = { version = "0.10.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2.7.1"
lopdf = "0.43.0"
regex = "1.11.1"
# Digital signing (PAdES B-B) — pure-Rust RustCrypto 0.7-era stack, pinned to
# one generation (der 0.7 / cms 0.2) so cert types pass cleanly between crates.
p12-keystore = "0.2"
cms = { version = "0.2.3", features = ["builder"] }
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
signature = "2"
const-oid = { version = "0.9", features = ["db"] }

[dev-dependencies]
# RSA 0.9 speaks rand_core 0.6 — match it for in-test key generation.
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
dev-tools = ["dep:rand"]

# Debug builds compile OUR crate unoptimized (fast iteration) but optimize all
# dependencies — image/JPEG encoding is ~10x slower unoptimized, which made
# every page re-render feel sluggish in dev.
[profile.dev.package."*"]
opt-level = 2
